<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  <!-- Outer Gradient Ring -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#badgeGrad)"/>
  <!-- Inner Obsidian Slate Box -->
  <rect x="5" y="5" width="54" height="54" rx="13" fill="#0F172A"/>
  <!-- Monogram Logo Text: <K/> -->
  <text x="32" y="41" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="25" text-anchor="middle" letter-spacing="-1">
    <tspan fill="#818CF8">&lt;</tspan><tspan fill="#FFFFFF">K</tspan><tspan fill="#34D399">/&gt;</tspan>
  </text>
</svg>
